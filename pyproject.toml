[project]
name = "project-67"
version = "0.1.0"
description = "Netflix Neural Taste Graph (NTG) prototype: offline recommender + risk radar."
authors = [{ name = "MohanSaiBandarupalli", email = "mb2279@njit.edu" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "duckdb>=1.0.0",
  "pandas>=2.3.0",
  "pyarrow>=23.0.0",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.12.0",
  "tqdm>=4.66.0",
  "matplotlib (>=3.10.8,<4.0.0)",
  "tabulate (>=0.9.0,<0.10.0)",
  "plotly (>=6.5.2,<7.0.0)",
  "kaleido (>=1.2.0,<2.0.0)",
  "fastapi (>=0.115)",
  "uvicorn (>=0.30)",
  "sqlalchemy (>=2.0)",
  "pyjwt (>=2.9)",
  "pyyaml (>=6.0)",
  "alembic (>=1.13)",
  "lightgbm (>=4.3)",
]

[tool.poetry]
name = "project-67"
version = "0.1.0"
description = "Netflix Neural Taste Graph (NTG) prototype: offline recommender + risk radar."
authors = ["MohanSaiBandarupalli <mb2279@njit.edu>"]
readme = "README.md"
packages = [{ include = "ntg", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^6.0.0"
httpx = ">=0.27"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
