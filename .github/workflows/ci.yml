name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Poetry
        run: pip install "poetry==2.0.0" && poetry config virtualenvs.in-project true
      - uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-v4-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi
      - name: Lint (v4 code)
        run: >
          poetry run ruff check src/ntg/core src/ntg/datasets src/ntg/recsys src/ntg/tastetwin src/ntg/intent
          src/ntg/discovery src/ntg/journey src/ntg/enterprise src/ntg/platform src/ntg/api
          src/ntg/pipelines/v4.py src/ntg/cli.py tests/v4 migrations
      - name: Tests (unit + v4; v4 builds a tiny synthetic bundle, no download needed)
        run: poetry run python -m pytest -q -W ignore
      - name: Migrations round-trip
        env: { NTG_DATABASE_URL: "sqlite:///ci_migrations.db" }
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ntg-api:ci .
      - run: docker build -t ntg-web:ci frontend
